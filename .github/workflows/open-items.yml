name: open-items
on:
  pull_request:
    paths: ['plugins/open-items/**', '.github/workflows/open-items.yml']
  push:
    branches: [main]
    paths: ['plugins/open-items/**', '.github/workflows/open-items.yml']
jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code@2.1.310
      - run: claude plugin validate plugins/open-items
      - run: claude plugin test plugins/open-items
