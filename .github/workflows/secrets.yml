name: secrets
on:
  pull_request:
    paths: ['plugins/secrets/**', '.github/workflows/secrets.yml']
  push:
    branches: [main]
    paths: ['plugins/secrets/**', '.github/workflows/secrets.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sh plugins/secrets/tests/run.sh
